services:
  - type: web
    name: virtual-assistant-pages-api
    runtime: node
    rootDir: app
    plan: free
    buildCommand: npm ci && npm test && npm run lint
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: REQUIRE_USER_KEY
        value: 'true'
      - key: SERVE_STATIC
        value: 'false'
      - key: ALLOWED_ORIGINS
        sync: false
