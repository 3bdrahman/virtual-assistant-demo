services:
  - type: web
    name: virtual-assistant-demo
    runtime: node
    rootDir: app
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NVIDIA_API_KEY
        sync: false
